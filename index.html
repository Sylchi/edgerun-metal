<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=web/">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; object-src 'none'">
  <link rel="canonical" href="https://sylchi.github.io/edgerun-c/web/">
  <title>EdgeRun</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f4ee; color: #171717; }
    main { width: min(32rem, calc(100vw - 2rem)); }
    h1 { margin: 0 0 0.75rem; font-size: clamp(2.25rem, 8vw, 4.5rem); line-height: 0.95; letter-spacing: 0; }
    p { margin: 0 0 1.25rem; color: #4c4c4c; line-height: 1.6; }
    a { color: #0f5d57; font-weight: 700; text-decoration-thickness: 0.12em; text-underline-offset: 0.2em; }
    @media (prefers-color-scheme: dark) {
      body { background: #111413; color: #f4f0e8; }
      p { color: #c9c4bb; }
      a { color: #73d6c8; }
    }
  </style>
</head>
<body>
  <main>
    <h1>EdgeRun</h1>
    <p>Opening the hosted runtime.</p>
    <a href="web/">Enter EdgeRun</a>
  </main>
</body>
</html>
