# EdgeRun Metal AArch64 UEFI QEMU launcher configuration.
# This smoke-tests the BOOTAA64.EFI image on QEMU virt. It does not emulate Pi 4B hardware.

qemu_binary = qemu-system-aarch64
machine = virt,gic-version=3
cpu = cortex-a72
memory_mb = 1024

display = gtk,zoom-to-fit=on,show-cursor=on
display_device = virtio-gpu-pci
width = 1920
height = 1080
refresh = 60
virtio_gpu = true

virtio_net = true
net_id = edgerun-aa64
net_mac = 02:31:32:33:34:35
capture =

boot_file = BOOTAA64.EFI
esp_drive_if = virtio
ovmf_code = /usr/share/edk2/aarch64/QEMU_EFI.fd
ovmf_vars = /usr/share/edk2/aarch64/QEMU_VARS.fd

tpm = false
tpm_persist_state = false
tpm_state_dir = build/aarch64/swtpm-state
tpm_socket = build/aarch64/swtpm.sock
tpm_pidfile = build/aarch64/swtpm.pid
