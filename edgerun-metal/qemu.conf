# EdgeRun Metal QEMU launcher configuration.
# Format: key = value. Blank lines and # comments are ignored.

qemu_binary = qemu-system-x86_64
memory_mb = 1024

display = gtk,zoom-to-fit=on,show-cursor=on
width = 1920
height = 1080
refresh = 60
virtio_gpu = true

virtio_net = true
net_id = edgerun0
net_mac = 02:21:22:23:24:25
capture =

ovmf_code = /usr/share/edk2/x64/OVMF_CODE.4m.fd
ovmf_vars = /usr/share/edk2/x64/OVMF_VARS.4m.fd

tpm = false
tpm_persist_state = false
tpm_state_dir = build/swtpm-state
tpm_socket = build/swtpm.sock
tpm_pidfile = build/swtpm.pid
