name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Zig
        env:
          ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          ZIG_DIR: .build/zig-0.16.0
        run: |
          set -euo pipefail
          mkdir -p "${ZIG_DIR}"
          curl -fsSLo .build/zig-0.16.0.tar.xz "${ZIG_URL}"
          printf '%s  %s\n' "${ZIG_SHA256}" .build/zig-0.16.0.tar.xz | sha256sum -c -
          tar -C "${ZIG_DIR}" --strip-components=1 -xf .build/zig-0.16.0.tar.xz
          printf '%s/%s\n' "${PWD}" "${ZIG_DIR}" >> "${GITHUB_PATH}"

      - name: Verify Zig version
        run: |
          set -euo pipefail
          test "$(zig version)" = "0.16.0"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages site
        run: |
          set -euo pipefail
          make pages-check

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/github-pages

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
