[package]
name = "edgerun-signing"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
edgerun-crypto = { path = "/home/ken/edgerun/crates/utility/edgerun-crypto", default-features = false, features = ["ed25519"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
